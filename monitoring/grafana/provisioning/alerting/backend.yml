apiVersion: 1

groups:
  - orgId: 1
    name: Backend availability
    folder: MyPlaylist
    interval: 30s
    rules:
      - uid: myplaylist-backend-down
        title: Backend unavailable
        condition: C
        for: 2m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: "MyPlaylist backend is unreachable"
          description: "Prometheus has been unable to scrape the backend for at least 2 minutes."
        labels:
          severity: warning
          service: backend
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: 'up{job="myplaylist-backend"}'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
              settings:
                mode: dropNN
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
